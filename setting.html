<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 | FayWooooo</title>
    <link rel="icon" href="logo.ico">
    <link rel="description" content="管理你的個人資料，包括顯示名稱、遊戲/社群 Tag 以及聯絡方式或個人簡介。">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- 頂部膠囊導航 -->
    <header class="topbar">
        <div class="logo"><i class="fa-solid fa-user-circle"></i> FayWooooo</div>
        
        <nav class="navbar-center">
            <a href="index.html">首頁</a>
            <a href="shop.html">兌換</a>
            <a href="articles.html">文章</a>
        </nav>

        <div class="user-status-group" id="userArea">
            <!-- 由 JS 自動從 Supabase / Auth 動態生成 -->
        </div>
    </header>

    <!-- 下拉選單 -->
 <div id="profileMenu" class="glass-card profile-menu hidden">
    <div class="profile-header">
        <img id="userAvatar" src="https://i.imgur.com/4M34hi2.png" alt="Avatar">
        <div class="profile-text">
            <h3 id="userName">載入中...</h3>
            <p id="tagDisplay" class="user-tag-wrapper">
                <i class="fa-solid fa-hashtag"></i> <span id="userTag">尚未設定</span>
                <button id="copyTagBtn" class="copy-tag-btn" title="複製標籤">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </p>
            <p id="coinDisplay"><i class="fa-solid fa-coins"></i> Fay幣：<span id="userCoins">--</span></p>
        </div>
    </div>
    <hr class="divider">
    <div class="menu-actions">
        <button class="menu-btn" onclick="location.href='profile.html'"><i class="fa-solid fa-id-card"></i> 個人資料設定</button>
        <button id="logoutBtn" class="menu-btn logout"><i class="fa-solid fa-right-from-bracket"></i> 登出帳號</button>
    </div>
</div>

    <!-- 主要內容區 -->
    <main class="container">
        
        <!-- 個人資料表單 -->
        <section class="card">
            <h2><i class="fa-solid fa-id-card"></i> 個人資料管理</h2>
            <p id="profileHint" class="hint-text">載入中...</p>

            <form id="profileForm" class="tm-form" style="margin-top: 15px;">
                <div class="form-input-group">
                    <label for="playerName"><i class="fa-solid fa-user"></i> 顯示名稱 (Display Name)</label>
                    <input type="text" id="playerName" required>
                </div>

                <div class="form-input-group">
                    <label for="playerTag"><i class="fa-solid fa-hashtag"></i> 遊戲 / 社群 Tag</label>
                    <input type="text" id="playerTag" required>
                </div>

                <div class="form-input-group">
                    <label for="contactInfo"><i class="fa-solid fa-envelope"></i> 聯絡方式 / 個人簡介 (Bio)</label>
                    <input type="text" id="contactInfo">
                </div>

                <button type="submit" class="tm-submit-btn">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存個人資料
                </button>
            </form>
        </section>

    </main>

    <!-- 自訂彈窗 Modal -->
    <div id="customModal" class="modal-backdrop hidden">
        <div class="card" style="max-width: 400px; width: 90%; text-align: center;">
            <h2 id="modalTitle" style="justify-content: center;"><i class="fa-solid fa-circle-info"></i> 提示</h2>
            <p id="modalMessage" style="margin: 15px 0; color: var(--text-dim);"></p>
            <button id="modalCloseBtn" class="main-btn" style="width: 100%;">確定</button>
        </div>
    </div>

    <!-- 行動裝置底部導航 -->
    <nav class="mobile-nav">
        <a href="index.html"><i class="fas fa-home"></i><br>首頁</a>
        <a href="shop.html"><i class="fas fa-store"></i><br>兌換</a>
        <a href="articles.html"><i class="fa-solid fa-book"></i><br>文章</a>
    </nav>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
